<svg width="1000" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#151a2e"/>
      <stop offset="100%" stop-color="#1a1035"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="orbGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="revealTitle">
      <rect x="0" y="0" width="0" height="280">
        <animate attributeName="width" values="0;620;620" keyTimes="0;0.5;1" dur="4s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="revealSub">
      <rect x="0" y="0" width="0" height="280">
        <animate attributeName="width" begin="2.4s" values="0;560" dur="1.8s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1000" height="280" fill="url(#bgGrad)"/>

  <circle cx="130" cy="60" r="120" fill="url(#orbGrad1)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 30 40; 0 0" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="880" cy="220" r="140" fill="url(#orbGrad2)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -35 -25; 0 0" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="50" r="80" fill="url(#orbGrad1)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -20 30; 0 0" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g fill="#c4b5fd">
    <circle cx="160" cy="230" r="2.4" opacity="0.75"><animate attributeName="cy" values="230;190;230" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="40" r="2" opacity="0.6"><animate attributeName="cy" values="40;75;40" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="60" r="2.6" opacity="0.7"><animate attributeName="cy" values="60;25;60" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="190" r="2" opacity="0.6"><animate attributeName="cy" values="190;225;190" dur="5.6s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="90" r="2.3" opacity="0.65"><animate attributeName="cy" values="90;120;90" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="230" r="2" opacity="0.55"><animate attributeName="cy" values="230;200;230" dur="6s" repeatCount="indefinite"/></circle>
  </g>

  <g clip-path="url(#revealTitle)">
    <text x="80" y="145" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="url(#titleGrad)">Chathuka Pehesara</text>
  </g>
  <rect x="80" y="105" width="4" height="48" fill="#c084fc">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" begin="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="80;700" dur="4s" fill="freeze"/>
  </rect>

  <g clip-path="url(#revealSub)">
    <text x="80" y="190" font-family="'Consolas', 'Courier New', monospace" font-size="22" fill="#9ca3af">Full-Stack Developer &#8226; AI &amp; ML Engineer &#8226; BSc (Hons) AI @ SLIIT</text>
  </g>
  <rect x="80" y="172" width="3" height="24" fill="#9ca3af">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" begin="4.2s" repeatCount="indefinite"/>
  </rect>

  <g font-family="'Consolas', 'Courier New', monospace" font-size="15" fill="#818cf8" opacity="0">
    <text x="80" y="225">
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.75;1" dur="5.5s" begin="0s" fill="freeze"/>
      Turning data into decisions, one model at a time.
    </text>
  </g>
</svg>

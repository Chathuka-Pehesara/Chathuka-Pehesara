<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      .display { font-family: 'Space Grotesk', 'Segoe UI', sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; }
    </style>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060B"/>
      <stop offset="55%" stop-color="#0A0D18"/>
      <stop offset="100%" stop-color="#0D1020"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E9EAF5"/>
      <stop offset="60%" stop-color="#C9CEFB"/>
      <stop offset="100%" stop-color="#7C5CFF"/>
    </linearGradient>

    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>

    <g id="hex">
      <polygon points="17.3,0 34.6,10 34.6,30 17.3,40 0,30 0,10" />
    </g>
  </defs>

  <rect width="1200" height="320" fill="url(#bgGrad)"/>

  <!-- hex tessellation field — staggered pulse, the page's signature motif -->
  <g stroke="#3A3F6B" stroke-width="1" fill="none" opacity="0.5">
    <use href="#hex" x="20"  y="14"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="4.2s" begin="0s" repeatCount="indefinite"/></use>
    <use href="#hex" x="55"  y="34"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="4.2s" begin="0.3s" repeatCount="indefinite"/></use>
    <use href="#hex" x="90"  y="14"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="4.2s" begin="0.6s" repeatCount="indefinite"/></use>
    <use href="#hex" x="125" y="34"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="4.2s" begin="0.9s" repeatCount="indefinite"/></use>
    <use href="#hex" x="160" y="14"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="4.2s" begin="1.2s" repeatCount="indefinite"/></use>

    <use href="#hex" x="20"  y="230"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.8s" begin="0.4s" repeatCount="indefinite"/></use>
    <use href="#hex" x="55"  y="250"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.8s" begin="0.8s" repeatCount="indefinite"/></use>
    <use href="#hex" x="90"  y="230"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.8s" begin="1.2s" repeatCount="indefinite"/></use>
    <use href="#hex" x="125" y="250"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.8s" begin="1.6s" repeatCount="indefinite"/></use>
    <use href="#hex" x="160" y="230"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.8s" begin="2.0s" repeatCount="indefinite"/></use>

    <use href="#hex" x="1000" y="20"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="4.5s" begin="0.2s" repeatCount="indefinite"/></use>
    <use href="#hex" x="1035" y="40"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="4.5s" begin="0.6s" repeatCount="indefinite"/></use>
    <use href="#hex" x="1070" y="20"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="4.5s" begin="1.0s" repeatCount="indefinite"/></use>
    <use href="#hex" x="1105" y="40"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="4.5s" begin="1.4s" repeatCount="indefinite"/></use>
    <use href="#hex" x="1140" y="20"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="4.5s" begin="1.8s" repeatCount="indefinite"/></use>

    <use href="#hex" x="1000" y="240"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.6s" begin="0.1s" repeatCount="indefinite"/></use>
    <use href="#hex" x="1035" y="260"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.6s" begin="0.5s" repeatCount="indefinite"/></use>
    <use href="#hex" x="1070" y="240"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.6s" begin="0.9s" repeatCount="indefinite"/></use>
    <use href="#hex" x="1105" y="260"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.6s" begin="1.3s" repeatCount="indefinite"/></use>
  </g>

  <!-- ambient glow behind monogram -->
  <circle cx="185" cy="160" r="130" fill="url(#glow)">
    <animate attributeName="r" values="120;140;120" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- rotating hex ring + monogram -->
  <g transform="translate(185,160)">
    <g>
      <polygon points="-70,-40.4 0,-80.8 70,-40.4 70,40.4 0,80.8 -70,40.4"
               fill="none" stroke="#7C5CFF" stroke-width="2" opacity="0.8" stroke-dasharray="6 10"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
    </g>
    <polygon points="-50,-28.9 0,-57.7 50,-28.9 50,28.9 0,57.7 -50,28.9"
             fill="#0D1020" stroke="#22D3EE" stroke-width="1.5" opacity="0.9"/>
    <text x="0" y="14" text-anchor="middle" class="display" font-size="34" font-weight="700" fill="url(#nameGrad)">CP</text>
    <circle r="4" fill="#FFB020">
      <animateMotion dur="22s" repeatCount="indefinite"
        path="M -70,-40.4 L 0,-80.8 L 70,-40.4 L 70,40.4 L 0,80.8 L -70,40.4 Z"/>
    </circle>
  </g>

  <!-- name + role -->
  <g transform="translate(340,0)">
    <text x="0" y="118" class="display" font-size="46" font-weight="700" fill="url(#nameGrad)">
      Chathuka Pehesara
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>

    <text x="2" y="150" class="mono" font-size="16" fill="#8A8FA8">$ whoami</text>

    <text x="2" y="180" class="mono" font-size="20" fill="#22D3EE">
      <tspan>
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.24;0.25;1" dur="8s" repeatCount="indefinite"/>
        Full-Stack Developer
      </tspan>
    </text>
    <text x="2" y="180" class="mono" font-size="20" fill="#22D3EE">
      <tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.26;0.49;0.5;1" dur="8s" repeatCount="indefinite"/>
        AI Model Architect
      </tspan>
    </text>
    <text x="2" y="180" class="mono" font-size="20" fill="#22D3EE">
      <tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.51;0.74;0.75;1" dur="8s" repeatCount="indefinite"/>
        Neural Pattern Enthusiast
      </tspan>
    </text>
    <text x="2" y="180" class="mono" font-size="20" fill="#22D3EE">
      <tspan>
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.76;1" dur="8s" repeatCount="indefinite"/>
        BSc AI @ SLIIT
      </tspan>
    </text>

    <text x="2" y="222" class="display" font-size="15" font-style="italic" fill="#8A8FA8">
      "Code with purpose, design with empathy."
    </text>

    <!-- circuit trace -->
    <rect x="0" y="250" width="820" height="2" fill="#22314F"/>
    <rect x="0" y="250" width="820" height="2" fill="url(#traceGrad)">
      <animate attributeName="x" values="-820;820" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="0" cy="251" r="4" fill="#22D3EE">
      <animate attributeName="cx" values="0;820" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>

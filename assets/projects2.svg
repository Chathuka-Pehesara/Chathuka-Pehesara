<svg width="1200" height="540" viewBox="0 0 1200 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      .display { font-family: 'Space Grotesk', 'Segoe UI', sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; }
    </style>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12162C"/>
      <stop offset="100%" stop-color="#0B0E1C"/>
    </linearGradient>
    <g id="chip"><rect rx="9" height="22" fill="#181D38" stroke="#2A3050"/></g>
    <g id="hexicon"><polygon points="34.6,26 46,32.8 46,46.4 34.6,53.2 23.1,46.4 23.1,32.8"/></g>
    <filter id="cardGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- ambient background hex specks drifting behind the grid -->
  <g stroke="#3A3F6B" stroke-width="1" fill="none" opacity="0.3">
    <polygon points="1160,10 1177,20 1177,40 1160,50 1143,40 1143,20"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="4.6s" repeatCount="indefinite"/></polygon>
    <polygon points="16,500 33,510 33,530 16,540 -1,530 -1,510"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="5.1s" begin="0.6s" repeatCount="indefinite"/></polygon>
  </g>

  <!-- ============================================================ -->
  <!-- CARD 1 — AI Situational Understanding Camera -->
  <!-- ============================================================ -->
  <g transform="translate(10,10)">
    <animateTransform attributeName="transform" type="translate" values="10,10; 10,4; 10,10" dur="4.4s" repeatCount="indefinite"/>
    <rect width="580" height="250" rx="16" fill="url(#cardGrad)"/>
    <circle cx="35" cy="40" r="10" fill="#22D3EE" filter="url(#cardGlow)" opacity="0.5">
      <animate attributeName="r" values="10;46;10" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <use href="#hexicon" fill="none" stroke="#22D3EE" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0 34.6 39.6" to="360 34.6 39.6" dur="8s" repeatCount="indefinite"/>
    </use>
    <circle r="3" fill="#FFB020">
      <animateMotion dur="8s" repeatCount="indefinite" path="M34.6,26 L46,32.8 L46,46.4 L34.6,53.2 L23.1,46.4 L23.1,32.8 Z"/>
    </circle>
    <circle cx="8" cy="8" r="4" fill="#28C840"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/></circle>

    <text x="26" y="90" class="display" font-size="20" font-weight="700" fill="#E9EAF5">AI Situational</text>
    <text x="26" y="114" class="display" font-size="20" font-weight="700" fill="#E9EAF5">Understanding Camera</text>

    <clipPath id="c1desc"><rect x="0" y="0" width="0" height="20"><animate attributeName="width" from="0" to="520" dur="1.4s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <g clip-path="url(#c1desc)">
      <text x="26" y="140" class="mono" font-size="12" fill="#8A8FA8">Reads a live scene in real time and flags situational risk cues.</text>
    </g>

    <use href="#chip" x="26" y="164" width="72"/><text x="42" y="179" class="mono" font-size="11" fill="#22D3EE">Python</text>
    <use href="#chip" x="104" y="164" width="86"/><text x="120" y="179" class="mono" font-size="11" fill="#22D3EE">OpenCV</text>
    <use href="#chip" x="196" y="164" width="98"/><text x="212" y="179" class="mono" font-size="11" fill="#22D3EE">TensorFlow</text>

    <!-- animated build progress bar -->
    <rect x="26" y="198" width="220" height="4" rx="2" fill="#1D2140"/>
    <rect x="26" y="198" height="4" rx="2" fill="#22D3EE">
      <animate attributeName="width" values="0;220;220;0" keyTimes="0;0.4;0.9;1" dur="6s" repeatCount="indefinite"/>
    </rect>

    <text x="26" y="228" class="mono" font-size="12" fill="#FFB020">↳ status: in active development</text>
  </g>

  <!-- ============================================================ -->
  <!-- CARD 2 — Book Link -->
  <!-- ============================================================ -->
  <g transform="translate(610,10)">
    <animateTransform attributeName="transform" type="translate" values="610,10; 610,4; 610,10" dur="4.4s" begin="0.5s" repeatCount="indefinite"/>
    <rect width="580" height="250" rx="16" fill="url(#cardGrad)"/>
    <circle cx="35" cy="40" r="10" fill="#7C5CFF" filter="url(#cardGlow)" opacity="0.5">
      <animate attributeName="r" values="10;46;10" dur="3.6s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.6s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <use href="#hexicon" fill="none" stroke="#7C5CFF" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="360 34.6 39.6" to="0 34.6 39.6" dur="8s" repeatCount="indefinite"/>
    </use>
    <circle r="3" fill="#FFB020">
      <animateMotion dur="8s" begin="1s" repeatCount="indefinite" path="M34.6,26 L46,32.8 L46,46.4 L34.6,53.2 L23.1,46.4 L23.1,32.8 Z"/>
    </circle>
    <circle cx="8" cy="8" r="4" fill="#28C840"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" begin="0.3s" repeatCount="indefinite"/></circle>

    <text x="26" y="90" class="display" font-size="20" font-weight="700" fill="#E9EAF5">Book Link</text>
    <text x="26" y="114" class="display" font-size="14" font-weight="600" fill="#8A8FA8">web &amp; mobile</text>

    <clipPath id="c2desc"><rect x="0" y="0" width="0" height="20"><animate attributeName="width" from="0" to="500" dur="1.3s" begin="0.6s" fill="freeze"/></rect></clipPath>
    <g clip-path="url(#c2desc)">
      <text x="26" y="140" class="mono" font-size="12" fill="#8A8FA8">Cross-platform app connecting readers to swap and share books.</text>
    </g>

    <use href="#chip" x="26" y="164" width="72"/><text x="42" y="179" class="mono" font-size="11" fill="#7C5CFF">React</text>
    <use href="#chip" x="104" y="164" width="96"/><text x="120" y="179" class="mono" font-size="11" fill="#7C5CFF">Next.js</text>
    <use href="#chip" x="206" y="164" width="70"/><text x="222" y="179" class="mono" font-size="11" fill="#7C5CFF">Node</text>

    <rect x="26" y="198" width="220" height="4" rx="2" fill="#1D2140"/>
    <rect x="26" y="198" height="4" rx="2" fill="#7C5CFF">
      <animate attributeName="width" values="0;150;150;0" keyTimes="0;0.55;0.9;1" dur="6.5s" repeatCount="indefinite"/>
    </rect>

    <text x="26" y="228" class="mono" font-size="12" fill="#FFB020">↳ status: prototyping</text>
  </g>

  <!-- ============================================================ -->
  <!-- CARD 3 — Snake Venom Classifier -->
  <!-- ============================================================ -->
  <g transform="translate(10,280)">
    <animateTransform attributeName="transform" type="translate" values="10,280; 10,274; 10,280" dur="4.4s" begin="1s" repeatCount="indefinite"/>
    <rect width="580" height="250" rx="16" fill="url(#cardGrad)"/>
    <circle cx="35" cy="40" r="10" fill="#FFB020" filter="url(#cardGlow)" opacity="0.5">
      <animate attributeName="r" values="10;46;10" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
    <use href="#hexicon" fill="none" stroke="#FFB020" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0 34.6 39.6" to="360 34.6 39.6" dur="8s" repeatCount="indefinite"/>
    </use>
    <circle r="3" fill="#22D3EE">
      <animateMotion dur="8s" begin="2s" repeatCount="indefinite" path="M34.6,26 L46,32.8 L46,46.4 L34.6,53.2 L23.1,46.4 L23.1,32.8 Z"/>
    </circle>
    <circle cx="8" cy="8" r="4" fill="#28C840"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></circle>

    <text x="26" y="90" class="display" font-size="20" font-weight="700" fill="#E9EAF5">Snake Venom</text>
    <text x="26" y="114" class="display" font-size="20" font-weight="700" fill="#E9EAF5">Classifier</text>

    <clipPath id="c3desc"><rect x="0" y="0" width="0" height="20"><animate attributeName="width" from="0" to="520" dur="1.4s" begin="0.9s" fill="freeze"/></rect></clipPath>
    <g clip-path="url(#c3desc)">
      <text x="26" y="140" class="mono" font-size="12" fill="#8A8FA8">Identifies venomous species from image input to guide first response.</text>
    </g>

    <use href="#chip" x="26" y="164" width="72"/><text x="42" y="179" class="mono" font-size="11" fill="#FFB020">Python</text>
    <use href="#chip" x="104" y="164" width="98"/><text x="120" y="179" class="mono" font-size="11" fill="#FFB020">Scikit-Learn</text>
    <use href="#chip" x="208" y="164" width="72"/><text x="224" y="179" class="mono" font-size="11" fill="#FFB020">Keras</text>

    <rect x="26" y="198" width="220" height="4" rx="2" fill="#1D2140"/>
    <rect x="26" y="198" height="4" rx="2" fill="#FFB020">
      <animate attributeName="width" values="0;200;200;0" keyTimes="0;0.75;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect>

    <text x="26" y="228" class="mono" font-size="12" fill="#28C840">↳ status: model training</text>
  </g>

  <!-- ============================================================ -->
  <!-- CARD 4 — Decision Simulator AI -->
  <!-- ============================================================ -->
  <g transform="translate(610,280)">
    <animateTransform attributeName="transform" type="translate" values="610,280; 610,274; 610,280" dur="4.4s" begin="1.5s" repeatCount="indefinite"/>
    <rect width="580" height="250" rx="16" fill="url(#cardGrad)"/>
    <circle cx="35" cy="40" r="10" fill="#22D3EE" filter="url(#cardGlow)" opacity="0.5">
      <animate attributeName="r" values="10;46;10" dur="3.6s" begin="2.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.6s" begin="2.7s" repeatCount="indefinite"/>
    </circle>
    <use href="#hexicon" fill="none" stroke="#22D3EE" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="360 34.6 39.6" to="0 34.6 39.6" dur="8s" repeatCount="indefinite"/>
    </use>
    <circle r="3" fill="#7C5CFF">
      <animateMotion dur="8s" begin="3s" repeatCount="indefinite" path="M34.6,26 L46,32.8 L46,46.4 L34.6,53.2 L23.1,46.4 L23.1,32.8 Z"/>
    </circle>
    <circle cx="8" cy="8" r="4" fill="#28C840"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" begin="0.9s" repeatCount="indefinite"/></circle>

    <text x="26" y="90" class="display" font-size="20" font-weight="700" fill="#E9EAF5">Decision</text>
    <text x="26" y="114" class="display" font-size="20" font-weight="700" fill="#E9EAF5">Simulator AI</text>

    <clipPath id="c4desc"><rect x="0" y="0" width="0" height="20"><animate attributeName="width" from="0" to="520" dur="1.4s" begin="1.2s" fill="freeze"/></rect></clipPath>
    <g clip-path="url(#c4desc)">
      <text x="26" y="140" class="mono" font-size="12" fill="#8A8FA8">Simulates branching outcomes so you compare consequences first.</text>
    </g>

    <use href="#chip" x="26" y="164" width="72"/><text x="42" y="179" class="mono" font-size="11" fill="#22D3EE">Python</text>
    <use href="#chip" x="104" y="164" width="72"/><text x="120" y="179" class="mono" font-size="11" fill="#22D3EE">React</text>
    <use href="#chip" x="182" y="164" width="112"/><text x="198" y="179" class="mono" font-size="11" fill="#22D3EE">Rule Engine</text>

    <rect x="26" y="198" width="220" height="4" rx="2" fill="#1D2140"/>
    <rect x="26" y="198" height="4" rx="2" fill="#22D3EE">
      <animate attributeName="width" values="0;90;90;0" keyTimes="0;0.3;0.9;1" dur="5.5s" repeatCount="indefinite"/>
    </rect>

    <text x="26" y="228" class="mono" font-size="12" fill="#FFB020">↳ status: early concept</text>
  </g>
</svg>

<svg width="600" height="320" viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; }
    </style>
    <linearGradient id="winGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12162A"/>
      <stop offset="100%" stop-color="#0B0E1C"/>
    </linearGradient>
    <clipPath id="cl1"><rect x="0" y="80" width="0" height="24"><animate attributeName="width" from="0" to="520" dur="0.9s" begin="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="cl2"><rect x="0" y="140" width="0" height="24"><animate attributeName="width" from="0" to="560" dur="1.0s" begin="1.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="cl3"><rect x="0" y="200" width="0" height="24"><animate attributeName="width" from="0" to="360" dur="0.7s" begin="2.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="cl4"><rect x="0" y="260" width="0" height="24"><animate attributeName="width" from="0" to="430" dur="1.0s" begin="3.6s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect x="1" y="1" width="598" height="318" rx="14" fill="url(#winGrad)" stroke="#2A3050" stroke-width="1.5"/>

  <!-- title bar -->
  <rect x="1" y="1" width="598" height="34" rx="14" fill="#151933"/>
  <rect x="1" y="20" width="598" height="15" fill="#151933"/>
  <circle cx="24" cy="18" r="6" fill="#FF5F57"/>
  <circle cx="44" cy="18" r="6" fill="#FEBC2E"/>
  <circle cx="64" cy="18" r="6" fill="#28C840"/>
  <text x="300" y="23" text-anchor="middle" class="mono" font-size="12" fill="#8A8FA8">chathuka@sliit: ~/portfolio</text>

  <g class="mono" font-size="15" fill="#E9EAF5">
    <text x="24" y="70"><tspan fill="#22D3EE">➜ </tspan><tspan fill="#FFB020">~</tspan> whoami</text>
    <g clip-path="url(#cl1)"><text x="24" y="96" fill="#8A8FA8">Chathuka Pehesara — full-stack dev, AI model designer</text></g>

    <text x="24" y="130"><tspan fill="#22D3EE">➜ </tspan><tspan fill="#FFB020">~</tspan> cat currently.txt</text>
    <g clip-path="url(#cl2)"><text x="24" y="156" fill="#8A8FA8">Building biosafety AI &amp; neural pattern recognition tools</text></g>

    <text x="24" y="190"><tspan fill="#22D3EE">➜ </tspan><tspan fill="#FFB020">~</tspan> ls stack/</text>
    <g clip-path="url(#cl3)"><text x="24" y="216" fill="#8A8FA8">react next.js python tensorflow aws</text></g>

    <text x="24" y="250"><tspan fill="#22D3EE">➜ </tspan><tspan fill="#FFB020">~</tspan> echo $MOTTO</text>
    <g clip-path="url(#cl4)"><text x="24" y="276" fill="#8A8FA8">"Code with purpose, design with empathy."</text></g>
  </g>

  <g class="mono" font-size="15">
    <text x="24" y="300" fill="#22D3EE">
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.72;0.73" dur="8s" begin="0s" repeatCount="indefinite"/>
      ➜ <tspan fill="#FFB020">~</tspan> _
    </text>
    <rect x="60" y="288" width="9" height="16" fill="#22D3EE">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" begin="5.9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0524"/>
      <stop offset="100%" stop-color="#1A0B33"/>
    </linearGradient>

    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#6366F1" flood-opacity="0.4"/>
    </filter>

    <style>
      .title{
        font:11px Consolas,monospace;
        fill:#94A3B8;
      }

      .txt{
        font:13px Consolas,monospace;
        fill:#CBD5E1;
      }

      .cyan{fill:#22D3EE;}
      .purple{fill:#A855F7;}
      .green{fill:#22C55E;}

      .cursor{
        animation:blink 1s infinite;
      }

      @keyframes blink{
        0%,50%{opacity:1}
        51%,100%{opacity:0}
      }
    </style>

  </defs>

  <!-- Glow -->
  <rect
    x="12"
    y="12"
    width="376"
    height="296"
    rx="16"
    fill="#6366F1"
    opacity="0.15"
    filter="url(#shadow)"
  />

  <!-- Window -->
  <rect
    x="10"
    y="10"
    width="380"
    height="300"
    rx="14"
    fill="url(#bg)"
    stroke="url(#border)"
    stroke-width="1.4"
  />

  <!-- Top bar -->
  <rect
    x="10"
    y="10"
    width="380"
    height="34"
    rx="14"
    fill="#140824"
  />

  <rect
    x="10"
    y="30"
    width="380"
    height="14"
    fill="#140824"
  />

  <!-- Mac buttons -->
  <circle cx="30" cy="27" r="5" fill="#FF5F56"/>
  <circle cx="48" cy="27" r="5" fill="#FFBD2E"/>
  <circle cx="66" cy="27" r="5" fill="#27C93F"/>

  <text
    x="200"
    y="29"
    text-anchor="middle"
    class="title">
    chathuka@dev:~
  </text>

  <!-- Content -->

  <text x="28" y="72" class="txt">
    <tspan class="cyan">$</tspan>
    <tspan class="purple"> whoami</tspan>
  </text>

  <text x="28" y="98" class="txt">
    &gt; Chathuka Pehesara
  </text>

  <text x="28" y="128" class="txt">
    <tspan class="cyan">$</tspan>
    <tspan class="purple"> cat</tspan> role.txt
  </text>

  <text x="28" y="154" class="txt">
    &gt; AI Engineer / Full-Stack Developer
  </text>

  <text x="28" y="184" class="txt">
    <tspan class="cyan">$</tspan>
    <tspan class="purple"> ./build</tspan> --stack ai,web
  </text>

  <text x="28" y="212" class="txt cyan">
    [✓] Loading neural models...
  </text>

  <text x="28" y="236" class="txt cyan">
    [✓] Compiling frontend...
  </text>

  <text x="28" y="260" class="txt green">
    [✓] Deployment successful
  </text>

  <text x="28" y="288" class="txt">
    <tspan class="cyan">$</tspan>
    <tspan class="cursor"> _</tspan>
  </text>

  <!-- Corner decorations -->
  <path
    d="M10 24V10H24"
    fill="none"
    stroke="#22D3EE"
    stroke-width="1.5"
    opacity="0.6"/>

  <path
    d="M376 296H390V282"
    fill="none"
    stroke="#22D3EE"
    stroke-width="1.5"
    opacity="0.6"/>

</svg>

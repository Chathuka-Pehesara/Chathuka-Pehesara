<svg width="760" height="320" viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Animated gradient for border + accents -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#a855f7;#ec4899;#6366f1" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#ec4899;#6366f1;#a855f7" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#6366f1;#a855f7;#ec4899" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="bgGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="l1"><rect x="0" y="0" width="0" height="320"><animate attributeName="width" begin="0.3s" values="0;90" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="0" y="0" width="0" height="320"><animate attributeName="width" begin="1.0s" values="0;620" dur="1.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="0" y="0" width="0" height="320"><animate attributeName="width" begin="2.6s" values="0;220" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="0" y="0" width="0" height="320"><animate attributeName="width" begin="3.4s" values="0;660" dur="1.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="0" y="0" width="0" height="320"><animate attributeName="width" begin="5.0s" values="0;580" dur="1.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="l6"><rect x="0" y="0" width="0" height="320"><animate attributeName="width" begin="6.4s" values="0;250" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="l7"><rect x="0" y="0" width="0" height="320"><animate attributeName="width" begin="7.2s" values="0;560" dur="1.2s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- Outer animated gradient border -->
  <rect x="1" y="1" width="758" height="318" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Base card -->
  <rect x="3" y="3" width="754" height="314" rx="14" fill="#0a0e14"/>

  <!-- Ambient glow orbs -->
  <circle cx="640" cy="60" r="140" fill="url(#bgGlow1)">
    <animate attributeName="cx" values="640;600;640" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="280" r="120" fill="url(#bgGlow2)">
    <animate attributeName="cy" values="280;250;280" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- Title bar -->
  <rect x="3" y="3" width="754" height="38" rx="14" fill="#111722"/>
  <rect x="3" y="27" width="754" height="14" fill="#111722"/>
  <circle cx="28" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="22" r="6" fill="#27c93f"/>
  <text x="380" y="27" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="13" fill="#6b7280" letter-spacing="0.5">chathuka@portfolio  ~  zsh</text>

  <!-- Terminal body -->
  <g font-family="'JetBrains Mono','Fira Code','Consolas',monospace" font-size="16">
    <g clip-path="url(#l1)" filter="url(#softGlow)">
      <text x="28" y="82" fill="#7ee787">➜</text>
      <text x="50" y="82" fill="#58a6ff">~</text>
      <text x="70" y="82" fill="#c9d1d9">whoami</text>
    </g>
    <g clip-path="url(#l2)">
      <text x="28" y="112" fill="#e0aaff" font-weight="600">Chathuka Pehesara — Full-Stack Developer &amp; AI Model Architect</text>
    </g>

    <g clip-path="url(#l3)" filter="url(#softGlow)">
      <text x="28" y="152" fill="#7ee787">➜</text>
      <text x="50" y="152" fill="#58a6ff">~</text>
      <text x="70" y="152" fill="#c9d1d9">./stack --list</text>
    </g>
    <g clip-path="url(#l4)">
      <text x="28" y="182" fill="#9ecbff">React · TensorFlow · Python · Spring · AWS</text>
    </g>

    <g clip-path="url(#l5)" filter="url(#softGlow)">
      <text x="28" y="220" fill="#7ee787">➜</text>
      <text x="50" y="220" fill="#58a6ff">~</text>
      <text x="70" y="220" fill="#c9d1d9">cat focus.txt</text>
    </g>
    <g clip-path="url(#l6)">
      <text x="28" y="250" fill="#f2cc60">Biosafety AI &amp; Neural Pattern Recognition</text>
    </g>

    <g clip-path="url(#l7)">
      <text x="28" y="285" fill="#7ee787" font-style="italic">✓ Open to internships, freelance &amp; collabs</text>
    </g>
  </g>

  <!-- Blinking cursor, appears after typing finishes -->
  <rect x="28" y="292" width="9" height="18" fill="#7ee787" opacity="0">
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.001;1" begin="8.4s" dur="0.1s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="8.5s" repeatCount="indefinite"/>
  </rect>
</svg>

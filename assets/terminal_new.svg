<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">

  <defs>
    <style>
      .title{
        font:11px Consolas,Monaco,'Courier New',monospace;
        fill:#94A3B8;
      }

      .txt{
        font:13px Consolas,Monaco,'Courier New',monospace;
        fill:#E2E8F0;
      }

      .cyan{fill:#22D3EE;}
      .purple{fill:#A855F7;}
      .green{fill:#22C55E;}

      .cursor{
        animation:blink 1s steps(1) infinite;
      }

      @keyframes blink{
        50%{opacity:0;}
      }
    </style>
  </defs>

  <!-- Window -->
  <rect
    x="12"
    y="12"
    width="376"
    height="296"
    rx="18"
    fill="#170B2B"
  />

  <!-- Header -->
  <rect
    x="12"
    y="12"
    width="376"
    height="40"
    rx="18"
    fill="#1F1238"
  />

  <rect
    x="12"
    y="34"
    width="376"
    height="18"
    fill="#1F1238"
  />

  <!-- macOS buttons -->
  <circle cx="30" cy="31" r="5" fill="#FF5F56"/>
  <circle cx="48" cy="31" r="5" fill="#FFBD2E"/>
  <circle cx="66" cy="31" r="5" fill="#27C93F"/>

  <text
    x="200"
    y="33"
    text-anchor="middle"
    class="title">
    chathuka@dev:~
  </text>

  <!-- Content -->

  <text x="28" y="80" class="txt">
    <tspan class="cyan">$</tspan>
    <tspan class="purple"> whoami</tspan>
  </text>

  <text x="28" y="106" class="txt">
    &gt; Chathuka Pehesara
  </text>

  <text x="28" y="140" class="txt">
    <tspan class="cyan">$</tspan>
    <tspan class="purple"> cat</tspan> role.txt
  </text>

  <text x="28" y="166" class="txt">
    &gt; AI Engineer / Full-Stack Developer
  </text>

  <text x="28" y="200" class="txt">
    <tspan class="cyan">$</tspan>
    <tspan class="purple"> ./build</tspan> --stack ai,web
  </text>

  <text x="28" y="226" class="txt green">
    [✓] Loading neural models...
  </text>

  <text x="28" y="248" class="txt green">
    [✓] Compiling frontend...
  </text>

  <text x="28" y="270" class="txt green">
    [✓] Deployment successful
  </text>

  <text x="28" y="296" class="txt">
    <tspan class="cyan">$</tspan>
    <tspan class="cursor"> _</tspan>
  </text>

</svg>

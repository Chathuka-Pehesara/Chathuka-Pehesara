<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0524"/>
      <stop offset="100%" stop-color="#1A0B33"/>
    </linearGradient>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="termGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- ambient glow behind window -->
  <rect x="10" y="10" width="380" height="300" rx="16" fill="#6366F1" opacity="0.25" filter="url(#termGlow)"/>

  <!-- window body -->
  <rect x="8" y="8" width="384" height="304" rx="14" fill="url(#termBg)" stroke="url(#termBorder)" stroke-width="1.4" stroke-opacity="0.6"/>

  <!-- title bar -->
  <rect x="8" y="8" width="384" height="34" rx="14" fill="#150826"/>
  <rect x="8" y="28" width="384" height="14" fill="#150826"/>
  <circle cx="30" cy="25" r="5" fill="#FF5F56"/>
  <circle cx="48" cy="25" r="5" fill="#FFBD2E"/>
  <circle cx="66" cy="25" r="5" fill="#27C93F"/>
  <text x="200" y="29" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="11" fill="#7C8AA5" letter-spacing="1">chathuka@dev: ~</text>

  <!-- body text, typewriter reveal -->
  <g font-family="'Consolas','Courier New',monospace" font-size="13.5" fill="#CBD5E1">

    <text x="26" y="72">
      <tspan fill="#22D3EE">$</tspan> <tspan fill="#A855F7">whoami</tspan>
    </text>

    <text x="26" y="98" opacity="0">
      &gt; Chathuka Pehesara
      <animate attributeName="opacity" to="1" begin="0.4s" dur="0.01s" fill="freeze"/>
    </text>

    <text x="26" y="130" opacity="0">
      <tspan fill="#22D3EE">$</tspan> <tspan fill="#A855F7">cat</tspan> role.txt
      <animate attributeName="opacity" to="1" begin="1.1s" dur="0.01s" fill="freeze"/>
    </text>
    <text x="26" y="156" opacity="0" fill="#94A3B8">
      &gt; AI Engineer / Full-Stack Dev
      <animate attributeName="opacity" to="1" begin="1.5s" dur="0.01s" fill="freeze"/>
    </text>

    <text x="26" y="188" opacity="0">
      <tspan fill="#22D3EE">$</tspan> <tspan fill="#A855F7">./build</tspan> --stack=ai,web
      <animate attributeName="opacity" to="1" begin="2.2s" dur="0.01s" fill="freeze"/>
    </text>

    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="2.7s" dur="0.01s" fill="freeze"/>
      <text x="26" y="212" fill="#22D3EE">[✓] loading neural weights...</text>
      <text x="26" y="232" fill="#22D3EE">[✓] compiling frontend...</text>
      <text x="26" y="252" fill="#27C93F">[✓] deployed — ready to ship 🚀</text>
    </g>

    <text x="26" y="284" opacity="0">
      <tspan fill="#22D3EE">$</tspan> <tspan id="term-cursor" fill="#E2E8F0">_</tspan>
      <animate attributeName="opacity" to="1" begin="3.2s" dur="0.01s" fill="freeze"/>
    </text>
    <animate xlink:href="#term-cursor" attributeName="opacity" values="1;0;1" dur="1s" begin="3.2s" repeatCount="indefinite"/>
  </g>

  <!-- corner accents -->
  <path d="M8 22 L8 8 L22 8" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.6"/>
  <path d="M378 296 L392 296 L392 282" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.6"/>
</svg>

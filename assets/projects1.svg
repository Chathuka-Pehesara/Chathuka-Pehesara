<svg width="1200" height="270" viewBox="0 0 1200 270" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      .display { font-family: 'Space Grotesk', 'Segoe UI', sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; }
    </style>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12162C"/>
      <stop offset="100%" stop-color="#0B0E1C"/>
    </linearGradient>
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </linearGradient>

    <!-- reusable card template -->
    <g id="chip"><rect rx="9" height="22" fill="#181D38" stroke="#2A3050"/></g>
  </defs>

  <rect width="1200" height="270" fill="none"/>

  <!-- CARD 1 -->
  <g transform="translate(10,10)">
    <rect width="380" height="250" rx="16" fill="url(#cardGrad)" stroke="#2A3050"/>
    <rect x="0" y="0" width="380" height="3" rx="1.5" fill="url(#edge)">
      <animate attributeName="x" values="-380;380" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <polygon points="34.6,26 46,32.8 46,46.4 34.6,53.2 23.1,46.4 23.1,32.8" fill="none" stroke="#22D3EE" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0 34.6 39.6" to="360 34.6 39.6" dur="9s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="8" cy="8" r="4" fill="#28C840"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>

    <text x="26" y="90" class="display" font-size="19" font-weight="700" fill="#E9EAF5">Biosafety AI Classifier</text>
    <text x="26" y="114" class="mono" font-size="12" fill="#8A8FA8">
      <tspan x="26" dy="0">Neural network that flags high-risk lab</tspan>
      <tspan x="26" dy="16">samples from pattern data in real time.</tspan>
    </text>

    <use href="#chip" x="26" y="150" width="72"/><text x="42" y="165" class="mono" font-size="11" fill="#22D3EE">Python</text>
    <use href="#chip" x="104" y="150" width="98"/><text x="120" y="165" class="mono" font-size="11" fill="#22D3EE">TensorFlow</text>
    <use href="#chip" x="208" y="150" width="72"/><text x="224" y="165" class="mono" font-size="11" fill="#22D3EE">AWS</text>

    <text x="26" y="228" class="mono" font-size="12" fill="#FFB020">↳ status: in active development</text>
  </g>

  <!-- CARD 2 -->
  <g transform="translate(410,10)">
    <rect width="380" height="250" rx="16" fill="url(#cardGrad)" stroke="#2A3050"/>
    <rect x="0" y="0" width="380" height="3" rx="1.5" fill="url(#edge)">
      <animate attributeName="x" values="-380;380" dur="3.2s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <polygon points="34.6,26 46,32.8 46,46.4 34.6,53.2 23.1,46.4 23.1,32.8" fill="none" stroke="#7C5CFF" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="360 34.6 39.6" to="0 34.6 39.6" dur="9s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="8" cy="8" r="4" fill="#28C840"><animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.3s" repeatCount="indefinite"/></circle>

    <text x="26" y="90" class="display" font-size="19" font-weight="700" fill="#E9EAF5">Neural Pattern Toolkit</text>
    <text x="26" y="114" class="mono" font-size="12" fill="#8A8FA8">
      <tspan x="26" dy="0">A visual toolkit for exploring and</tspan>
      <tspan x="26" dy="16">debugging model activations layer by layer.</tspan>
    </text>

    <use href="#chip" x="26" y="150" width="72"/><text x="42" y="165" class="mono" font-size="11" fill="#7C5CFF">React</text>
    <use href="#chip" x="104" y="150" width="88"/><text x="120" y="165" class="mono" font-size="11" fill="#7C5CFF">Sci-Kit</text>
    <use href="#chip" x="198" y="150" width="72"/><text x="214" y="165" class="mono" font-size="11" fill="#7C5CFF">Keras</text>

    <text x="26" y="228" class="mono" font-size="12" fill="#FFB020">↳ status: prototyping</text>
  </g>

  <!-- CARD 3 -->
  <g transform="translate(810,10)">
    <rect width="380" height="250" rx="16" fill="url(#cardGrad)" stroke="#2A3050"/>
    <rect x="0" y="0" width="380" height="3" rx="1.5" fill="url(#edge)">
      <animate attributeName="x" values="-380;380" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <polygon points="34.6,26 46,32.8 46,46.4 34.6,53.2 23.1,46.4 23.1,32.8" fill="none" stroke="#FFB020" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0 34.6 39.6" to="360 34.6 39.6" dur="9s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="8" cy="8" r="4" fill="#28C840"><animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.6s" repeatCount="indefinite"/></circle>

    <text x="26" y="90" class="display" font-size="19" font-weight="700" fill="#E9EAF5">Portfolio Engine</text>
    <text x="26" y="114" class="mono" font-size="12" fill="#8A8FA8">
      <tspan x="26" dy="0">This very README — a hand-built,</tspan>
      <tspan x="26" dy="16">hex-themed SVG rendering system.</tspan>
    </text>

    <use href="#chip" x="26" y="150" width="72"/><text x="42" y="165" class="mono" font-size="11" fill="#FFB020">SVG</text>
    <use href="#chip" x="104" y="150" width="88"/><text x="120" y="165" class="mono" font-size="11" fill="#FFB020">Next.js</text>
    <use href="#chip" x="198" y="150" width="82"/><text x="214" y="165" class="mono" font-size="11" fill="#FFB020">Vite</text>

    <text x="26" y="228" class="mono" font-size="12" fill="#28C840">↳ status: live</text>
  </g>
</svg>

<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <circle cx="160" cy="160" r="145" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="12 10" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 160 160" to="360 160 160" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="160" r="130" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="130;138;130" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>


<svg xmlns="http://www.w3.org/2000/svg"
     width="1600" height="900" viewBox="0 0 1600 900">

<defs>
  <linearGradient id="bg" x2="1" y2="1">
    <stop stop-color="#111113"/>
    <stop offset="1" stop-color="#09090c"/>
  </linearGradient>

  <linearGradient id="purple" x2="1">
    <stop stop-color="#a98aff"/>
    <stop offset="1" stop-color="#7042e8"/>
  </linearGradient>

  <linearGradient id="concrete" x2="1" y2="1">
    <stop stop-color="#77777b"/>
    <stop offset=".5" stop-color="#414145"/>
    <stop offset="1" stop-color="#202024"/>
  </linearGradient>

  <linearGradient id="glass" x2="1" y2="1">
    <stop stop-color="#9868ed" stop-opacity=".8"/>
    <stop offset="1" stop-color="#211331" stop-opacity=".9"/>
  </linearGradient>

  <radialGradient id="glow">
    <stop stop-color="#8855ff" stop-opacity=".5"/>
    <stop offset="1" stop-color="#8855ff" stop-opacity="0"/>
  </radialGradient>

  <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
    <path d="M80 0H0V80" fill="none"
          stroke="#fff" stroke-opacity=".045"/>
  </pattern>

  <pattern id="texture" width="70" height="70" patternUnits="userSpaceOnUse">
    <path d="M5 15L40 14M25 50L65 49"
          stroke="#fff" stroke-opacity=".08"/>
  </pattern>

  <filter id="blur">
    <feGaussianBlur stdDeviation="35"/>
  </filter>
</defs>

<!-- BACKGROUND -->
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#grid)"/>

<ellipse cx="1350" cy="420" rx="420" ry="400"
         fill="url(#glow)" filter="url(#blur)">
  <animate attributeName="opacity"
           values=".6;1;.6" dur="8s" repeatCount="indefinite"/>
</ellipse>

<!-- ARCHITECTURAL BACKGROUND -->
<path d="M1000 500L1310 240L1600 150V900H1000Z"
      fill="#08080a"/>

<!-- PURPLE GLASS BUILDING -->
<polygon points="1270,280 1480,175 1600,220 1600,740 1270,740"
         fill="url(#glass)"/>

<g stroke="#c8aaff" stroke-opacity=".25" fill="none">
  <path d="M1350 220V740M1450 190V740M1550 210V740"/>
  <path d="M1270 370H1600M1270 500H1600M1270 630H1600"/>
</g>

<!-- MAIN CONCRETE STRUCTURE -->
<polygon points="1170,320 1445,155 1600,190 1330,390"
         fill="url(#concrete)"/>

<path d="M1170 320L1445 155L1600 190"
      stroke="#b7b7bb" stroke-opacity=".5" fill="none" stroke-width="2"/>

<!-- STRUCTURAL PILLAR -->
<polygon points="1330,390 1415,335 1415,750 1330,800"
         fill="url(#concrete)"/>

<polygon points="1415,335 1465,305 1465,715 1415,750"
         fill="#29292d"/>

<path d="M1330 390L1415 335V750L1330 800Z"
      fill="url(#texture)"/>

<!-- ARCHITECTURAL BRIDGE -->
<polygon points="1120,460 1330,335 1600,390 1600,445 1330,390 1120,515"
         fill="#626267"/>

<!-- LOWER PLATFORM -->
<polygon points="760,785 1080,620 1330,700 1010,900 650,900"
         fill="url(#concrete)"/>

<path d="M760 785L1080 620L1330 700"
      stroke="#aaa" stroke-opacity=".5" fill="none" stroke-width="2"/>

<path d="M760 785L1010 900L1330 700"
      fill="url(#texture)"/>

<!-- HUMAN SILHOUETTE -->
<g fill="#080809">
  <circle cx="1110" cy="516" r="8"/>
  <path d="M1103 526Q1110 520 1117 526L1122 562L1118 579H1102L1098 562Z"/>
  <path d="M1103 531L1094 558L1099 561L1108 540Z"/>
  <path d="M1117 531L1125 555L1121 559L1113 541Z"/>
  <path d="M1103 575H1110L1107 610H1102Z"/>
  <path d="M1112 575H1119L1120 610H1115Z"/>
</g>

<!-- TECHNICAL FRAME -->
<g stroke="#777" stroke-opacity=".3" fill="none">
  <path d="M20 55H1580M20 850H1580"/>
  <path d="M45 0V900M1550 0V900"/>
  <path d="M0 236H1600" stroke-opacity=".08"/>
</g>

<!-- TOP LABEL -->
<g fill="#b8b8bc" font-family="Arial,sans-serif"
   font-size="16" letter-spacing="5">
  <text x="88" y="96">SOFTWARE ENGINEERING</text>
  <text x="395" y="96">/</text>
  <text x="430" y="96">ARTIFICIAL INTELLIGENCE</text>
  <text x="755" y="96">/</text>
  <text x="790" y="96">INNOVATION</text>
</g>

<path d="M930 95H1540" stroke="#777" stroke-opacity=".5"/>

<rect x="1565" y="87" width="17" height="17" fill="#9668ff">
  <animate attributeName="opacity"
           values=".4;1;.4" dur="3s" repeatCount="indefinite"/>
</rect>

<!-- CP IDENTITY -->
<g transform="translate(90 185)">
  <text x="0" y="58" fill="#d5d5d8"
        font-family="Arial,sans-serif"
        font-size="75" font-weight="300"
        letter-spacing="-8">CP</text>

  <path d="M148 0V75" stroke="#a78bfa" stroke-width="1.5"/>

  <g fill="#afafb3" font-family="monospace"
     font-size="15" letter-spacing="2">
    <text x="185" y="20">BUILDING</text>
    <text x="185" y="43">INTELLIGENT</text>
    <text x="185" y="66">SYSTEMS</text>
  </g>
</g>

<!-- MAIN NAME -->
<g font-family="Arial,Helvetica,sans-serif" font-weight="700">
  <text x="85" y="390" font-size="105"
        letter-spacing="-3" fill="#f1f1f2">
    CHATHUKA
  </text>

  <text x="85" y="480" font-size="105"
        letter-spacing="-4" fill="url(#purple)">
    PEHESARA.
  </text>
</g>

<path d="M88 505H175" stroke="#a98aff" stroke-width="2"/>

<!-- TAGLINE -->
<text x="90" y="565" font-family="monospace"
      font-size="23" fill="#e2e2e5">
  Engineering software. Exploring intelligence.
</text>

<rect x="744" y="540" width="2" height="29" fill="#a98aff">
  <animate attributeName="opacity"
           values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
</rect>

<!-- DESCRIPTION -->
<g font-family="Arial,sans-serif" font-size="21" fill="#a7a7ab">
  <text x="90" y="640">
    Full-Stack Developer &amp; AI Engineer building practical applications,
  </text>
  <text x="90" y="672">
    intelligent systems and meaningful digital experiences.
  </text>
</g>

<!-- FOOTER DETAILS -->
<g font-family="Arial,sans-serif" fill="#a5a5aa" font-size="16">
  <text x="90" y="835">BASED IN SRI LANKA</text>
  <circle cx="270" cy="830" r="3" fill="#a98aff"/>
  <text x="295" y="835">
    BSc (Hons) ARTIFICIAL INTELLIGENCE @ SLIIT
  </text>
</g>

<g font-family="monospace" fill="#b9b9be"
   font-size="14" letter-spacing="3">
  <text x="1270" y="835">LEARN</text>
  <text x="1360" y="835">·</text>
  <text x="1390" y="835">BUILD</text>
  <text x="1475" y="835">·</text>
  <text x="1500" y="835">INNOVATE</text>
</g>

<!-- ANIMATED SCANNING LINE -->
<rect x="0" y="150" width="1600" height="1"
      fill="#a98aff" opacity=".15">
  <animate attributeName="y"
           values="150;780;150"
           dur="14s" repeatCount="indefinite"/>
</rect>

</svg>

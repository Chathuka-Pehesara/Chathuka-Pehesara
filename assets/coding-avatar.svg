<svg width="800" height="480" viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      .display { font-family: 'Space Grotesk', 'Segoe UI', sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; }
    </style>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05060B"/>
      <stop offset="100%" stop-color="#0D1020"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#132038"/>
      <stop offset="100%" stop-color="#0A1220"/>
    </linearGradient>
    <radialGradient id="deskGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="faceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screenClip"><rect x="272" y="286" width="256" height="96" rx="6"/></clipPath>
  </defs>

  <rect width="800" height="480" fill="url(#bg2)"/>

  <!-- faint hex field -->
  <g stroke="#3A3F6B" stroke-width="1" fill="none" opacity="0.35">
    <polygon points="47,20 64,30 64,50 47,60 30,50 30,30"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="5s" begin="0s" repeatCount="indefinite"/></polygon>
    <polygon points="720,26 737,36 737,56 720,66 703,56 703,36"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="4.5s" begin="0.7s" repeatCount="indefinite"/></polygon>
    <polygon points="740,400 757,410 757,430 740,440 723,430 723,410"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="5.2s" begin="1.1s" repeatCount="indefinite"/></polygon>
    <polygon points="40,410 57,420 57,440 40,450 23,440 23,420"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="4.8s" begin="1.6s" repeatCount="indefinite"/></polygon>
  </g>

  <ellipse cx="400" cy="180" rx="260" ry="160" fill="url(#deskGlow)"/>

  <!-- ============ GENERIC SILHOUETTE CHARACTER ============ -->
  <g transform="translate(400,175)">
    <!-- glitch ghost layers -->
    <g opacity="0.28" fill="#FF3B7F">
      <path d="M-92,205 Q-92,90 0,84 Q92,90 92,205 Z"/>
      <circle cx="0" cy="10" r="54"/>
      <animateTransform attributeName="transform" type="translate" values="-3,0; 6,0; -5,0; -3,0" keyTimes="0;0.1;0.11;1" dur="4.6s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.28" fill="#22D3EE">
      <path d="M-92,205 Q-92,90 0,84 Q92,90 92,205 Z"/>
      <circle cx="0" cy="10" r="54"/>
      <animateTransform attributeName="transform" type="translate" values="3,0; -6,0; 5,0; 3,0" keyTimes="0;0.1;0.11;1" dur="4.6s" begin="0.04s" repeatCount="indefinite"/>
    </g>

    <!-- main silhouette: hoodie + head, flat and generic (no likeness) -->
    <path d="M-92,205 Q-92,90 0,84 Q92,90 92,205 Z" fill="#12141F" stroke="#2A3050" stroke-width="1.5"/>
    <!-- hood, up and forward, hides the face in shadow -->
    <path d="M-58,60 Q0,20 58,60 Q66,90 44,108 Q30,72 0,68 Q-30,72 -44,108 Q-66,90 -58,60 Z" fill="#181B2C" stroke="#2A3050" stroke-width="1.5"/>
    <!-- face shadow void, lit only by the screen glow -->
    <circle cx="0" cy="8" r="46" fill="#05060B"/>
    <ellipse cx="0" cy="26" rx="44" ry="26" fill="url(#faceGlow)">
      <animate attributeName="opacity" values="0.55;0.85;0.55" dur="2.6s" repeatCount="indefinite"/>
    </ellipse>
    <!-- glasses reflecting the screen -->
    <rect x="-30" y="10" width="24" height="12" rx="4" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.85"/>
    <rect x="6" y="10" width="24" height="12" rx="4" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.85"/>
    <rect x="-6" y="14" width="12" height="2" fill="#22D3EE" opacity="0.85"/>

    <!-- zip + hoodie strings -->
    <rect x="-1.5" y="112" width="3" height="90" fill="#3A3F55"/>
    <path d="M-14,112 Q-14,130 -18,150" fill="none" stroke="#3A3F55" stroke-width="3" stroke-linecap="round"/>
    <path d="M14,112 Q14,130 18,150" fill="none" stroke="#3A3F55" stroke-width="3" stroke-linecap="round"/>

    <!-- arms toward keyboard -->
    <path d="M-68,148 Q-92,188 -58,222 L-38,212 Q-60,182 -46,153 Z" fill="#12141F"/>
    <path d="M68,148 Q92,188 58,222 L38,212 Q60,182 46,153 Z" fill="#12141F"/>
    <circle cx="-50" cy="219" r="8" fill="#1A1D2E"/>
    <circle cx="50" cy="219" r="8" fill="#1A1D2E"/>

    <!-- brand tag -->
    <rect x="-20" y="168" width="40" height="12" rx="2" fill="#0D0D16" stroke="#3A3F55" stroke-width="0.75"/>
    <text x="0" y="176" text-anchor="middle" class="mono" font-size="6" fill="#8A8FA8">HEX·MAN</text>

    <!-- scanline sweep over the character -->
    <g opacity="0.5">
      <rect x="-95" y="-10" width="190" height="5" fill="#22D3EE">
        <animate attributeName="y" values="-10;250;-10" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="3.6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- glitch block noise -->
    <rect x="-40" y="130" width="24" height="7" fill="#22D3EE">
      <animate attributeName="opacity" values="0;0;0.8;0;0" keyTimes="0;0.3;0.32;0.34;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="20" y="60" width="20" height="6" fill="#FF3B7F">
      <animate attributeName="opacity" values="0;0;0.7;0;0" keyTimes="0;0.55;0.57;0.6;1" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ============ DESK ============ -->
  <rect x="120" y="404" width="560" height="16" rx="4" fill="#171B33"/>
  <rect x="120" y="404" width="560" height="3" fill="#7C5CFF" opacity="0.6"/>
  <rect x="150" y="420" width="16" height="46" fill="#0F1224"/>
  <rect x="634" y="420" width="16" height="46" fill="#0F1224"/>

  <!-- coffee mug -->
  <g transform="translate(590,362)">
    <rect x="0" y="10" width="30" height="34" rx="4" fill="#22314F"/>
    <path d="M30,16 q14,0 14,14 q0,14 -14,14" fill="none" stroke="#22314F" stroke-width="6"/>
    <rect x="4" y="6" width="22" height="6" rx="2" fill="#FFB020" opacity="0.85"/>
  </g>

  <!-- ============ LAPTOP with glitching CP logo ============ -->
  <g>
    <path d="M240,404 L560,404 L544,382 L256,382 Z" fill="#171B33" stroke="#2A3050"/>
    <rect x="270" y="390" width="260" height="4" rx="2" fill="#0B0E1C"/>
    <path d="M260,286 L540,286 L544,382 L256,382 Z" fill="#0B0E1C" stroke="#2A3050" stroke-width="2"/>
    <rect x="272" y="292" width="256" height="84" rx="4" fill="url(#screenGlow)"/>

    <g clip-path="url(#screenClip)">
      <!-- CP glitch logo -->
      <g class="display" font-size="46" font-weight="700" text-anchor="middle">
        <text x="400" y="345" fill="#22D3EE" opacity="0.9">CP
          <animate attributeName="opacity" values="0.9;0.9;0.15;0.9;0.9;0.2;0.9" keyTimes="0;0.35;0.37;0.39;0.7;0.72;1" dur="5s" repeatCount="indefinite"/>
        </text>
        <text x="404" y="345" fill="#FF3B7F" opacity="0.5">CP
          <animate attributeName="x" values="404;396;404;404" keyTimes="0;0.36;0.38;1" dur="5s" repeatCount="indefinite"/>
        </text>
        <text x="396" y="345" fill="#7C5CFF" opacity="0.5">CP
          <animate attributeName="x" values="396;404;396;396" keyTimes="0;0.36;0.38;1" dur="5s" repeatCount="indefinite"/>
        </text>
      </g>
      <!-- terminal caret under the logo -->
      <text x="400" y="366" text-anchor="middle" class="mono" font-size="11" fill="#8A8FA8">chathuka.pehesara <tspan fill="#22D3EE">_</tspan>
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1.2s" repeatCount="indefinite"/>
      </text>
      <!-- scanlines on screen -->
      <g opacity="0.4">
        <rect x="272" y="292" width="256" height="3" fill="#22D3EE">
          <animate attributeName="y" values="292;372;292" dur="3s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
    <rect x="272" y="292" width="256" height="84" rx="4" fill="none" stroke="#22D3EE" stroke-opacity="0.25"/>
  </g>

  <!-- caption -->
  <text x="400" y="460" text-anchor="middle" class="mono" font-size="13" fill="#8A8FA8">
    <tspan fill="#22D3EE">$</tspan> status --watch
    <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
  </text>
</svg>

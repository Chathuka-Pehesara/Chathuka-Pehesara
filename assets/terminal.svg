<svg width="720" height="300" viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="l1"><rect x="0" y="0" width="0" height="300"><animate attributeName="width" begin="0.3s" values="0;300" dur="1s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="0" y="0" width="0" height="300"><animate attributeName="width" begin="1.6s" values="0;560" dur="1.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="0" y="0" width="0" height="300"><animate attributeName="width" begin="3.4s" values="0;260" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="0" y="0" width="0" height="300"><animate attributeName="width" begin="4.6s" values="0;600" dur="1.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="0" y="0" width="0" height="300"><animate attributeName="width" begin="6.4s" values="0;220" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="l6"><rect x="0" y="0" width="0" height="300"><animate attributeName="width" begin="7.4s" values="0;420" dur="1.1s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect x="0" y="0" width="720" height="300" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="0" y="0" width="720" height="36" rx="12" fill="#161b22"/>
  <rect x="0" y="24" width="720" height="12" fill="#161b22"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="18" r="6" fill="#27c93f"/>
  <text x="360" y="23" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="13" fill="#8b949e">chathuka@portfolio: ~</text>

  <g font-family="'Consolas','Courier New',monospace" font-size="17">
    <g clip-path="url(#l1)">
      <text x="24" y="72" fill="#7ee787">$</text>
      <text x="44" y="72" fill="#c9d1d9">whoami</text>
    </g>
    <g clip-path="url(#l2)">
      <text x="24" y="102" fill="#a5a5f5">Chathuka Pehesara — Full-Stack Developer &amp; AI Engineer</text>
    </g>

    <g clip-path="url(#l3)">
      <text x="24" y="140" fill="#7ee787">$</text>
      <text x="44" y="140" fill="#c9d1d9">cat mission.txt</text>
    </g>
    <g clip-path="url(#l4)">
      <text x="24" y="170" fill="#a5a5f5">Building intelligent, human-centred systems — from</text>
      <text x="24" y="192" fill="#a5a5f5">deep learning models to production-ready apps.</text>
    </g>

    <g clip-path="url(#l5)">
      <text x="24" y="228" fill="#7ee787">$</text>
      <text x="44" y="228" fill="#c9d1d9">status --current</text>
    </g>
    <g clip-path="url(#l6)">
      <text x="24" y="258" fill="#f2cc60">Open to internships, freelance work &amp; collabs</text>
    </g>
  </g>

  <rect x="24" y="266" width="10" height="18" fill="#7ee787">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="8.2s" repeatCount="indefinite"/>
  </rect>
</svg>
